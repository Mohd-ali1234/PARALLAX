name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
          POSTGRES_DB: parallax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PARALLAX_ENV: local
      PARALLAX_POSTGRES_HOST: localhost
      PARALLAX_POSTGRES_PORT: "5432"
      PARALLAX_POSTGRES_USER: parallax
      PARALLAX_POSTGRES_PASSWORD: parallax
      PARALLAX_POSTGRES_DB: parallax_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify migrations apply and reverse
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest --cov=parallax --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: runtime
          push: false
          load: true
          tags: parallax-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

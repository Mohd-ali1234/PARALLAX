name: parallax

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parallax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parallax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parallax}
      POSTGRES_DB: ${POSTGRES_DB:-parallax}
      # Deterministic collation so ORDER BY matches across dev machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parallax} -d ${POSTGRES_DB:-parallax}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: parallax-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: parallax-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; use Qdrant's own readiness exit code.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: parallax-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parallax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parallax123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: creates the artifact bucket, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: parallax-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parallax}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-parallax123}
      BUCKET: ${PARALLAX_MINIO_BUCKET:-parallax-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc version enable local/$$BUCKET &&
      echo 'bucket ready: '$$BUCKET
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: ${API_BUILD_TARGET:-dev}
    container_name: parallax-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PARALLAX_POSTGRES_HOST: postgres
      PARALLAX_REDIS_URL: redis://redis:6379/0
      PARALLAX_QDRANT_URL: http://qdrant:6333
      PARALLAX_MINIO_ENDPOINT: minio:9000
      PARALLAX_RUN_MIGRATIONS: "true"
    ports:
      - "${PARALLAX_API_PORT:-8000}:8000"
    volumes:
      # Live reload in the dev target; harmless in prod builds that don't watch.
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: ${FRONTEND_BUILD_TARGET:-dev}
    container_name: parallax-frontend
    restart: unless-stopped
    environment:
      # In the dev target the Vite proxy talks to the API over the compose network.
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "${VITE_USE_POLLING:-true}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # Keep the image's node_modules; the host has none inside the container.
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
